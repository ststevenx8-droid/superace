<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ST WIN ACE - Profile</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body class="dark-theme">
  <header class="navbar">
    <div class="nav-container">
      <a href="../index.html" class="logo"><span class="gold-text">ST WIN</span> <span class="red-text">ACE</span></a>
      <nav class="nav-links">
        <a href="../index.html">Home</a>
        <a href="game.html">Play Game</a>
        <a href="wallet.html">Wallet</a>
        <a href="profile.html" class="active">Profile</a>
      </nav>
    </div>
  </header>

  <main class="page-container">
    <div class="card auth-card" style="max-width: 500px; margin: 0 auto;">
      <h2>User Profile</h2>
      <div class="profile-details mt-4">
        <p><strong>Name:</strong> <span id="prof-name">Guest</span></p>
        <p><strong>Email:</strong> <span id="prof-email">guest@demo.local</span></p>
        <p><strong>Virtual Balance:</strong> 🪙 <span id="prof-balance">10,000</span></p>
        <p><strong>Account Status:</strong> <span class="badge-active">Active Demo Player</span></p>
      </div>
      <button class="btn btn-outline full-width mt-4" id="prof-logout">Log Out</button>
    </div>
  </main>

  <script type="module">
    import { AuthController } from '../js/auth.js';
    AuthController.init((user) => {
      if (user) {
        document.getElementById('prof-name').textContent = user.name;
        document.getElementById('prof-email').textContent = user.email;
        document.getElementById('prof-balance').textContent = user.virtualBalance.toLocaleString();
        document.getElementById('prof-logout').style.display = 'block';
        document.getElementById('prof-logout').addEventListener('click', () => {
          AuthController.logout();
          window.location.href = '../index.html';
        });
      } else {
        document.getElementById('prof-logout').style.display = 'none';
      }
    });
  </script>
</body>
</html>
