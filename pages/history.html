<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ST WIN ACE - Game History</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="dark-theme">
  <header class="navbar">
    <div class="nav-container">
      <a href="../index.html" class="logo"><span class="gold-text">ST WIN</span> <span class="red-text">ACE</span></a>
      <nav class="nav-links">
        <a href="../index.html">Home</a>
        <a href="game.html">Play Game</a>
        <a href="history.html" class="active">History</a>
        <a href="wallet.html">Wallet</a>
        <a href="profile.html">Profile</a>
      </nav>
    </div>
  </header>

  <main class="page-container">
    <div class="card wide-card">
      <div class="card-header-flex">
        <h2>Your Recent Spin History</h2>
        <button class="btn btn-outline" id="refresh-btn">Refresh</button>
      </div>
      
      <div class="table-responsive">
        <table class="data-table">
          <thead>
            <tr>
              <th>Date</th>
              <th>Time</th>
              <th>Virtual Bet</th>
              <th>Virtual Win</th>
              <th>Remaining Balance</th>
            </tr>
          </thead>
          <tbody id="history-table-body">
            <tr><td colspan="5" class="center-text">Loading history records...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script type="module">
    import { AuthController } from '../js/auth.js';
    import { db, ref, get } from '../js/firebase.js';

    async function loadHistory(user) {
      const tbody = document.getElementById('history-table-body');
      tbody.innerHTML = '';

      let records = [];

      if (user) {
        const snap = await get(ref(db, `gameHistory/${user.uid}`));
        if (snap.exists()) {
          const val = snap.val();
          records = Object.values(val).reverse();
        }
      } else {
        records = JSON.parse(localStorage.getItem('guestHistory') || '[]');
      }

      if (records.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="center-text">No spin history found yet. Spin the reels in Demo Mode!</td></tr>`;
        return;
      }

      records.forEach(row => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${row.date || 'Today'}</td>
          <td>${row.time || '--:--'}</td>
          <td>${row.bet}</td>
          <td class="${row.win > 0 ? 'win-color' : ''}">${row.win > 0 ? '+' + row.win : '0'}</td>
          <td>🪙 ${row.balance.toLocaleString()}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    AuthController.init((user) => {
      loadHistory(user);
      document.getElementById('refresh-btn').addEventListener('click', () => loadHistory(user));
    });
  </script>
</body>
</html>
