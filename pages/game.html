<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ST WIN ACE - Slot Cabinet Demo</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="game-body">
  
  <!-- Header Bar -->
  <header class="game-header">
    <a href="../index.html" class="back-link">← Home</a>
    <div class="game-title-badge">ST WIN ACE <span>DEMO</span></div>
    <div class="balance-badge">
      <span class="label">VIRTUAL BALANCE</span>
      <span class="value" id="balance-display">10,000</span>
    </div>
  </header>

  <!-- Free Spins Banner -->
  <div class="freespins-banner" id="freespins-badge" style="display: none;">
    FREE SPINS REMAINING: 5
  </div>

  <!-- Arcade Game Cabinet -->
  <main class="cabinet-container">
    <div class="arcade-cabinet" id="game-cabinet">
      
      <!-- Top Cabinet Marquee -->
      <div class="cabinet-top">
        <div class="neon-light"></div>
        <div class="marquee-title">★ ST WIN ACE ★</div>
        <div class="neon-light"></div>
      </div>

      <!-- Reels Screen (5 Columns x 3 Rows) -->
      <div class="reels-frame">
        <div class="reels-grid" id="reels-container">
          <!-- Dynamic 5 Reel Strips -->
        </div>
      </div>

      <!-- Bottom Dashboard Controls -->
      <div class="cabinet-dashboard">
        <div class="dash-stat">
          <span class="stat-lbl">LAST WIN</span>
          <span class="stat-val win-color" id="last-win-display">0</span>
        </div>

        <div class="dash-controls">
          <div class="bet-adjuster">
            <button class="dash-btn" id="bet-minus">-</button>
            <div class="bet-info">
              <span class="stat-lbl">BET</span>
              <span class="stat-val" id="bet-display">10</span>
            </div>
            <button class="dash-btn" id="bet-plus">+</button>
          </div>
          
          <button class="dash-btn max-btn" id="bet-max">MAX BET</button>
        </div>

        <button class="big-spin-button" id="spin-btn">
          <span>SPIN</span>
        </button>
      </div>

    </div>
  </main>

  <!-- Win Announcement Overlay -->
  <div class="win-modal-overlay" id="win-modal">
    <div class="win-modal-card pop-in">
      <h1 class="win-title" id="win-title-text">BIG WIN!</h1>
      <h2 class="win-amount" id="win-amount-text">+500 COINS</h2>
    </div>
  </div>

  <!-- Game Scripts -->
  <script type="module" src="../js/game.js"></script>
</body>
</html>
