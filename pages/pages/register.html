<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ST WIN ACE - Register</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body class="dark-theme flex-center-body">
  <div class="card auth-card">
    <div class="center-text mb-4">
      <a href="../index.html" class="logo"><span class="gold-text">ST WIN</span> <span class="red-text">ACE</span></a>
      <p class="hint-text mt-1">Create free virtual demo profile</p>
    </div>

    <form id="register-form" class="standard-form">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="reg-name" required placeholder="John Doe">
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="reg-email" required placeholder="user@example.com">
      </div>
      <div class="form-group">
        <label>Password (min. 6 characters)</label>
        <input type="password" id="reg-password" minlength="6" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primary full-width">Create Account (10,000 Coins)</button>
    </form>

    <div id="reg-error" class="alert-box error mt-3" style="display: none;"></div>

    <p class="center-text mt-4 hint-text">
      Already have an account? <a href="login.html" class="gold-text">Login</a>
    </p>
  </div>

  <script type="module">
    import { AuthController } from '../js/auth.js';
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errBox = document.getElementById('reg-error');
      errBox.style.display = 'none';
      try {
        await AuthController.register(
          document.getElementById('reg-name').value,
          document.getElementById('reg-email').value,
          document.getElementById('reg-password').value
        );
        window.location.href = 'game.html';
      } catch (err) {
        errBox.textContent = err.message;
        errBox.style.display = 'block';
      }
    });
  </script>
</body>
</html>
